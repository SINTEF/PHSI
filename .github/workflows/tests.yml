name: Tests and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.10
      - run: uv sync --locked --extra dev --extra examples --python "${{ matrix.python }}"
      - run: uv pip check --python .venv/bin/python
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m pytest
      - name: Check paper experiment settings when present
        if: hashFiles('reproduce/tests/test_*.py') != ''
        run: uv run --no-sync python -m pytest reproduce/tests
      - run: uv run --no-sync python -m build
      - run: PHSI_DIST_DIR=dist uv run --no-sync python -m pytest tests/test_distribution.py
